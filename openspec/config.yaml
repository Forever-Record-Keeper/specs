schema: spec-driven

context: |
  Forever Record Keeper records sessions of World of Warcraft Forever with OBS Studio.
  It tags each recording from the combat log and the chat log of the game.
  A library on the local network plays the video next to the log.
  This store holds the plans. The other repos of the GitHub organization
  Forever-Record-Keeper implement them. Run `gh repo list Forever-Record-Keeper`
  for the current repos. The AGENTS.md of each repo describes its stack.
  Write in plain US English: 1 idea per sentence, 25 words or fewer, active voice.
  Use the terms of glossary.md in the root of this repo.

rules:
  proposal:
    - Name the repos that the change touches.
    - State what is out of scope.
  specs:
    - Write each requirement as 1 EARS sentence with the keyword SHALL, in 20 words or fewer.
    - Name the system with a glossary term, such as the app, the addon, the library or the website.
    - Use only words that a test can check. Give values with units, such as 2 min.
    - Start each scenario name with its ID, such as "REC-01". The prefix belongs to the capability.
  tasks:
    - Group the tasks by repo, in the order of implementation. Interfaces between repos come first.
